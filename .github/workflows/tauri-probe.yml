name: Pult 4.0 (Tauri)

on:
  push:
    branches: [tauri-probe]
    paths: ['src-tauri/**', 'src/renderer/**', 'src/core/**', 'src/report/**', 'src/cabinet.js', 'server/**', 'README-win.txt', '.github/workflows/tauri-probe.yml']
  workflow_dispatch:

jobs:
  build:
    name: Build Pult 4.0 for Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare the interface (unchanged src/renderer + Tauri bridge)
        run: node src-tauri/ui/prepare-ui.js
      - name: Rust tests (files layer, on Windows)
        working-directory: src-tauri
        run: cargo test
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build
      - name: Sizes
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/pult-glavspeca.exe
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $lines = @(
            "## Пульт 4.0 — размеры",
            "| Файл | МБ |", "|---|---|",
            ("| Программа (pult-glavspeca.exe) | {0:N1} |" -f ($exe.Length / 1MB)),
            ("| Установщик ({0}) | {1:N1} |" -f $setup.Name, ($setup.Length / 1MB))
          )
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $lines | Write-Output
      - name: Installer with the readme
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          (Get-Content -Raw -Encoding utf8 README-win.txt) -replace "`r?`n", "`r`n" | Set-Content -NoNewline -Encoding utf8 "release/ПРОЧТИ.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: PultGlavspeca-4.0-setup
          path: release/*
      - uses: actions/upload-artifact@v4
        with:
          name: PultGlavspeca-4.0-portable
          path: src-tauri/target/release/pult-glavspeca.exe
