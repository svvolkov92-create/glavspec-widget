name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-tests:
    name: Unit tests on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test "test/*.test.js"

  window-checks:
    name: Window checks (Tauri interface in Chromium) and smokes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Prepare the interface
        run: node src-tauri/ui/prepare-ui.js
      - name: Window checks (with Rust stand-ins and a real Pult server)
        run: node src-tauri/ui/check-ui.js
      - name: Smoke tests (the whole interface, one profile each)
        id: smokes
        run: node test/run-smokes.js
      - name: Upload screenshots and logs
        if: always() && steps.smokes.outputs.out != ''
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: ${{ steps.smokes.outputs.out }}
          retention-days: 14

  package:
    name: Customer cabinet server package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: bash server/build-cabinet.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KabinetZakazchika-server
          path: dist/KabinetZakazchika-server.zip

  pult-server:
    name: Pult server (shared base) — tests and installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests
        run: node --test test/pult-server.test.js
      - name: Web version on a phone (Playwright)
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node test/web-check.js
      - name: Build the installer
        run: bash server/build-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PultServer
          path: dist/PultServer/

