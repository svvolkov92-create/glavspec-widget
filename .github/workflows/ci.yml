name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-tests:
    name: Tests on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Electron (same version as the installer)
        run: npm install --no-save --no-package-lock electron@33.4.11
      - name: Unit tests
        run: node --test "test/*.test.js"
      - name: Smoke tests (real app windows)
        id: smokes
        run: node test/run-smokes.js
      - name: Upload screenshots and logs
        if: always() && steps.smokes.outputs.out != ''
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-windows
          path: ${{ steps.smokes.outputs.out }}
          retention-days: 14

  package:
    name: Build installer and server packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test "test/*.test.js"
      - name: Build
        run: bash build-win.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PultGlavspeca-setup
          path: dist/PultGlavspeca-setup.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KabinetZakazchika-server
          path: dist/KabinetZakazchika-server.zip
