[package]
name = "pult-glavspeca"
version = "3.99.1"
description = "Пульт главспеца на Tauri — проба, этап 2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-global-shortcut = "2"

# Small binary: the point of the probe is to measure size.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
